# Dash: nginx site configuration.
#
# This is a server block, not a complete nginx.conf. The Dockerfile installs it as
# /etc/nginx/conf.d/default.conf, so it runs inside the stock nginx:alpine http {} block,
# which supplies mime.types, sendfile and logging to the container's stdout/stderr.
#
# The container speaks plain HTTP on port 80. Cloudflare Tunnel terminates TLS in front of
# it for https://dash.unserver23.net.

# Cache-Control for each path, chosen here so that no location below needs its own
# add_header. (An add_header inside a location drops every add_header from the server
# level, including the security headers.)
#
#   /assets/*            Vite output with a content hash in the file name. A new build
#                        produces new names, so a copy can be kept forever.
#   /workbox-<hash>.js   Workbox runtime that sw.js imports. Its name is a content hash
#                        too, and it changes whenever the runtime changes.
#   *.png                Icons (favicon, apple-touch-icon, pwa-*). Not hashed, so they get
#                        a moderate cache.
#   everything else      index.html and every SPA fallback, sw.js, registerSW.js,
#                        manifest.webmanifest and /healthz. These are revalidated on every
#                        load (ETag/Last-Modified make that a cheap 304); otherwise
#                        installed copies of the app would miss updates.
map $uri $dash_cache_control {
    default                      "no-cache";
    ~^/assets/                   "public, max-age=31536000, immutable";
    ~^/workbox-[0-9a-f]+\.js$    "public, max-age=31536000, immutable";
    ~\.png$                      "public, max-age=86400";
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # TLS ends at Cloudflare, so redirects must never point at http://<host>:80.
    absolute_redirect off;
    charset utf-8;

    # Compress text. Cloudflare re-compresses on the way to the phone; this mainly helps
    # direct LAN access.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json
               application/manifest+json image/svg+xml;

    # The only add_header lines in this file. Do not add add_header inside a location:
    # see the comment above the map.
    # Cache-Control has no `always`, so it applies only to 2xx/3xx responses. A 404 for a
    # missing hashed file must never be cached for a year.
    add_header Cache-Control $dash_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    # Cross-origin requests must keep carrying the origin. A Mapbox token restricted by URL
    # checks the Referer of the style and tile requests, so do not tighten this to
    # no-referrer or same-origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # There is deliberately no Permissions-Policy. The browser defaults already allow
    # geolocation, the motion sensors and screen wake lock for this origin, and a wrong
    # policy would break the GPS, compass or wake lock without any error.

    # SPA: any path that is not a file gets the app shell. try_files falls back with an
    # internal redirect, so the response is cached as /index.html (no-cache).
    location / {
        try_files $uri /index.html;
    }

    # Hashed build output. A missing file is a real 404, never index.html, so HTML can
    # never be cached under a .js or .css name.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~ ^/workbox-[0-9a-f]+\.js$ {
        try_files $uri =404;
    }

    # Serve the right MIME type whether or not the image's mime.types knows .webmanifest.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Liveness check for the Docker HEALTHCHECK and deploy.sh.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
